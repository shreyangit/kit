name: Keep HF Space Warm

# Ping the /health endpoint every 5 minutes to prevent cold starts.
# GitHub Actions minimum cron interval = 5 minutes.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping HF Space health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "${{ secrets.HF_SPACE_URL }}/health")
          echo "Response status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: Space returned $STATUS (may be waking up)"
          fi
